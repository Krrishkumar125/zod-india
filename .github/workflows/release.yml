name: Release

# Manual only. Publishes to npm with trusted publishing (OIDC), so no
# NPM_TOKEN secret is needed. The trusted publisher on npmjs.com must point
# at this file (release.yml).
on:
  workflow_dispatch:

permissions:
  contents: write # changesets pushes the version commit and tags
  pull-requests: write # changesets opens the "Version Packages" PR
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      # v1.7.0+ no longer writes an empty token to .npmrc when NPM_TOKEN is unset.
      - uses: changesets/action@v1.9.0
        with:
          publish: npm run release
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
